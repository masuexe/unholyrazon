# Hand-authored namespaced AppendStatusBar definitions.
# priority controls draw order and actor naming only; selector amounts are
# allocated densely inside each (position, priority) bank.

schema_version = 1
namespace = "UHSS"
clear_callback = "UHSS_DrawBar_Clear"

[[bars]]
id = "body"
position = "1"
priority = 0
vertical_full = "23_B_BAR"
vertical_empty = "BAREMPTY"
horizontal_full = "23_B_VAR"
horizontal_empty = "VAREMPTY"
capacity = 112
legacy_catalog = true

[[bars]]
id = "ready"
position = "1"
priority = 10
vertical_full = "23_G_BAR"
vertical_empty = "NOBAR"
horizontal_full = "23_G_VAR"
horizontal_empty = "VNOBAR"
capacity = 1
legacy_catalog = true
