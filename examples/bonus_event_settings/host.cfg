// Load this file after the server starts. Paths are relative to the engine.
// Reset only the events that this example changes.
uh_event_reset demoneye_parade
uh_event_reset boss_ffa
uh_event_reset brick_eyes
uh_event_set demoneye_parade minplayers 8
uh_event_set boss_ffa mode random
uh_event_set boss_ffa weight 2
uh_event_set brick_eyes mode forced
uh_event_show demoneye_parade
uh_event_show boss_ffa
uh_event_show brick_eyes
